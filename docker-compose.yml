services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # Loopback only by default (use a reverse proxy or SSH tunnel). To reach it from your LAN/VPN, change 127.0.0.1
      # to that address, ideally with REQUIRE_PASSWORD=true in .env. Never expose this to the public internet.
      - "127.0.0.1:8090:5000"
    env_file:
      - .env   # copy server/.env.example to ./.env (GEMINI_API_KEY, JWT_SECRET, APP_KEY...); stays on the server
    environment:
      TZ: ${TZ:-UTC}   # so "today" starts at local midnight, e.g. TZ=Europe/London in .env or your shell
      DATABASE_URL: file:/data/health.db
      HOST: 0.0.0.0   # inside the container; the published port above decides who can reach it
    volumes:
      - health_data:/data
      # Optional: serve an Android APK you built yourself at /download/<file>
      # - ./downloads:/app/server/downloads:ro

volumes:
  health_data:
